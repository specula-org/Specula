\* Scenario 1 (bug #5204) as a liveness check. See
\* ../../references/liveness-pattern.md.
\* Expected: violation (Case C). One server starts with an invalid vote
\* extension; it counts its own precommit and decides, the other server drops
\* that precommit and never decides.
\* Control: SPECIFICATION LiveSpec with MaxInvalidVELimit = 0 passes with BFS
\* finished, and INVARIANT NoDecisionInv (no PROPERTY) is violated there, so the
\* premise is reachable.
SPECIFICATION LiveSpecVE

CONSTANTS
    \* 2 servers: the smallest set where one invalid vote extension splits the
    \* precommit quorum. 3 servers do not finish BFS with a liveness property.
    Server = {s1, s2}
    MaxHeight = 1
    MaxRound = 0
    Nil = Nil
    NilVote = NilVote
    Values = {v1}

    ProposalMsg = "ProposalMsg"
    PrevoteMsg = "PrevoteMsg"
    PrecommitMsg = "PrecommitMsg"

    StepNewHeight = "StepNewHeight"
    StepNewRound = "StepNewRound"
    StepPropose = "StepPropose"
    StepPrevote = "StepPrevote"
    StepPrevoteWait = "StepPrevoteWait"
    StepPrecommit = "StepPrecommit"
    StepPrecommitWait = "StepPrecommitWait"
    StepCommit = "StepCommit"

    ValidVE = "ValidVE"
    InvalidVE = "InvalidVE"
    NoVE = "NoVE"

    DuplicateVoteEv = "DuplicateVoteEv"

    \* Timeouts drive progress here, so their limit must not bind.
    MaxTimeoutLimit = 100
    \* Faults: the single invalid vote extension comes from MCInitVE.
    MaxCrashLimit = 0
    MaxLoseLimit = 0
    MaxInvalidVELimit = 1
    \* Unused: no CONSTRAINT in a liveness cfg.
    MaxMsgBufferLimit = 20

\* No SYMMETRY, VIEW, or CONSTRAINT.
PROPERTY DecisionSpreadsLive
