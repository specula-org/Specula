SPECIFICATION FullUpdateSpec
CONSTANTS
    BootPeers <- DefaultBootPeers
    Server = {s1, s2, s3}
    Joining = {}
    RawNodes = {s1, s2, s3}
    PreVoteNodes = {s1, s2, s3}
    CheckQuorumNodes = {s1, s2, s3}
    NoForwardNodes = {}
    RequestId = {1, 2, 3}
    PayloadWeights = {0, 1}
    EncodedWeights = {1, 2}
    ElectionTick = 3
    HeartbeatTick = 1
    MaxInflight = 2
    MaxMsgSize = 2
    MaxReadySize = 3
    MaxUncommitted = 3
    SendPolicy = "Strict"
    PersistPolicy = "Atomic"
    EarlyAdvance = TRUE
    ReadFence = "Inclusive"
    CancelChanges = {}
    CancelUnknownRemovals = TRUE
    RecoveryMode = "Replay"
    TickLimit = 5
    CampaignLimit = 3
    RequestLimit = 3
    CrashLimit = 1
    LossLimit = 1
    DuplicateLimit = 0
    TransferLimit = 1
    SnapshotLimit = 1
    CompactLimit = 1
    AvailabilityLimit = 0
    CancelLimit = 0
    ReportLimit = 1
    QuiesceLimit = 0
    MaxTermLimit = 4
    MaxLogLimit = 12
    MaxMsgBufferLimit = 14
    WorkloadKinds = {"Normal", "V2", "Read"}
    AllowEmptyContext = FALSE
INVARIANTS
    ElectionSafety
    LogMatching
    LeaderCompleteness
    CommittedHistory
    AppliedAgreement
    MCTypeOK
    LogStructure
    UpdateJointConfigurationShape
    QuorumAccounting
    UpdateReadyOwnership
    UpdateAutoLeaveAdvance
    UpdateJointSnapshotRecovery
CONSTRAINT StateConstraint
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
